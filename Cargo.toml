[package]
name = "nanopi"
version = "0.9.3"
edition = "2021"
description = "A minimal Rust port of Pi agent"
license = "MIT"
repository = "https://github.com/ChrisZhangJin/nanopi"
readme = "README.md"

[[bin]]
name = "nanopi"
path = "src/main.rs"

[lib]
name = "nanopi"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.5", default-features = false, features = ["std", "help", "usage", "derive"] }
# `rustls-tls` is load-bearing: without a TLS feature reqwest still
# COMPILES, it just cannot do https at runtime. `hickory-dns` replaces the
# system resolver (added by 96aa4e4 so the wizard's probe survives DNS
# poisoning). Neither is safe to drop on a green build alone.
reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "rustls-tls", "hickory-dns"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1.40", default-features = false, features = ["rt-multi-thread", "macros", "io-util", "process", "time", "sync", "signal"] }
bytes = { version = "1", default-features = false }
tokio-util = { version = "0.7", default-features = false }

serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
dirs = "5.0"

# TUI input events (alt-screen drawing is ratatui's job).
# crossterm 0.29+ dropped the granular features (cursor/terminal/style);
# defaults include events + windows. We skip `windows` on Unix targets
# and only enable it on Windows below (see [target.'cfg(windows)'…]).
# `events` is implied by `event-stream`; listed anyway so the dependency
# is explicit if that implication ever changes upstream.
crossterm = { version = "0.29", default-features = false, features = ["events", "event-stream", "bracketed-paste"] }

# The interactive TUI. Layered on crossterm.
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }

# UUID v7 (time-ordered). `std` is for now_v7()'s timestamp source.
# No `serde`: session ids are stored as plain strings.
uuid = { version = "1.10", default-features = false, features = ["v7", "std"] }

# Config + settings files
toml = "0.8"
# v0.9.3: comment-preserving TOML writer for settings.toml round-trip.
toml_edit = "0.22"

# async fn in trait objects
async-trait = "0.1"

# Hook matchers + the grep tool
regex = { version = "1.10", default-features = false, features = ["std"] }

# Date/time (RFC3339 for sessions)
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# v0.8: image base64 encoding for the read tool's vision path.
base64 = { version = "0.22", default-features = false, features = ["std"] }

# Windows-only: crossterm needs its `windows` feature to compile on
# Windows targets (pulls in crossterm_winapi / windows-sys). Merging
# happens via feature-union, so Unix targets stay lean.
[target.'cfg(windows)'.dependencies]
crossterm = { version = "0.29", features = ["windows"] }

[dev-dependencies]
# v0.9.3: for settings_toml tests that need a scratch NANOPI_HOME.
tempfile = "3"

[profile.release]
opt-level = "z"          # optimize for size
lto = true               # link-time optimization
codegen-units = 1        # single codegen unit for better optimization
panic = "abort"          # smaller binary, no unwind tables
strip = true             # strip symbols
incremental = false      # no incremental compilation for release
