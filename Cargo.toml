[package]
name = "nanopi"
version = "0.7.0"
edition = "2021"
description = "A minimal Rust port of Pi agent"

# v0.5 builds the modular binary; v0.1 entry kept around for regression testing.
[[bin]]
name = "nanopi"
path = "src/main.rs"

[[bin]]
name = "nanopi_v0_1"
path = "src/v0.1_main.rs"

[lib]
name = "nanopi"
path = "src/lib.rs"

[dependencies]
# --- v0.1 deps (kept) ---
clap = { version = "4.5", default-features = false, features = ["std", "help", "usage", "derive"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "rustls-tls"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
bytes = { version = "1", default-features = false }
tokio = { version = "1.40", default-features = false, features = ["rt-multi-thread", "macros", "io-util", "net", "process", "time", "sync", "signal"] }
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }

# v0.6+: line editor with history (↑↓) and standard shortcuts.
rustyline = { version = "14", default-features = false, features = ["with-file-history"] }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
dirs = "5.0"

# --- v0.5 NEW ---
# TUI (alt-screen, color, cursor, events).
# crossterm 0.29+ dropped the granular features (cursor/terminal/style);
# defaults include events + windows, which we trim to skip Windows deps.
crossterm = { version = "0.29", default-features = false, features = ["events", "event-stream", "bracketed-paste"] }

# v0.6+: ratatui full TUI (opt-in via --tui). Layered on crossterm.
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }

# UUID v7 (time-ordered). Needs `std` for now_v7() (timestamp source).
uuid = { version = "1.10", default-features = false, features = ["v7", "std", "serde"] }

# YAML frontmatter for skills
serde_yaml = "0.9"

# Config + settings files
toml = "0.8"

# async fn in trait objects
async-trait = "0.1"

# Hook matcher regex
regex = { version = "1.10", default-features = false, features = ["std"] }

# Date/time (RFC3339 for sessions)
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

# Structured logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# v0.8: image base64 encoding for the read tool's vision path.
base64 = { version = "0.22", default-features = false, features = ["std"] }

[profile.release]
opt-level = "z"          # optimize for size
lto = true               # link-time optimization
codegen-units = 1        # single codegen unit for better optimization
panic = "abort"          # smaller binary, no unwind tables
strip = true             # strip symbols
incremental = false      # no incremental compilation for release
