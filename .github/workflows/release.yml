name: release

# Fires when a version tag is pushed (v0.8.0, v0.8.1, v1.0.0, …).
# Also exposes a manual "Run workflow" button on the Actions tab
# with a tag input, so back-filling assets on an existing release
# (e.g. v0.8.0 which was tagged before this workflow existed) is
# one click away.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build + upload assets for (e.g. v0.8.0)'
        required: true
        type: string

jobs:
  build:
    name: build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ''
          # Fully static build for old glibc systems (CentOS 7 etc.).
          # rustls-tls means no OpenSSL C dep — musl links clean.
          - name: linux-x86_64-musl
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            ext: ''
          - name: macos-aarch64
            runner: macos-latest
            target: aarch64-apple-darwin
            ext: ''
          - name: macos-x86_64
            runner: macos-13
            target: x86_64-apple-darwin
            ext: ''
          - name: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            ext: '.exe'

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          # workflow_dispatch: pull the given tag; push event: default HEAD.
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: install musl toolchain
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: stage asset
        shell: bash
        run: |
          set -eux
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          SRC="target/${{ matrix.target }}/release/nanopi${{ matrix.ext }}"
          OUT="nanopi-${TAG}-${{ matrix.name }}${{ matrix.ext }}"
          mkdir -p dist
          cp "$SRC" "dist/$OUT"
          # Strip on Unix targets to shrink the binary. Windows keeps
          # symbols so debuggers can find them.
          if [ "${{ matrix.name }}" != "windows-x86_64" ]; then
            strip "dist/$OUT" || true
          fi
          ls -lh "dist/$OUT"

      - name: upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -eux
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          # --clobber overwrites if the asset already exists (rerun-safe).
          gh release upload "$TAG" dist/* \
            --repo "${{ github.repository }}" \
            --clobber
