name: release

# Fires when a version tag is pushed (v0.8.0, v0.8.1, v1.0.0, …).
# Also exposes a manual "Run workflow" button on the Actions tab
# with a tag input, so back-filling assets on an existing release
# (e.g. v0.8.0 which was tagged before this workflow existed) is
# one click away.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build + upload assets for (e.g. v0.8.0)'
        required: true
        type: string

# GitHub tightened default GITHUB_TOKEN scopes to read-only for new repos;
# creating releases and uploading assets both need `contents: write`.
permissions:
  contents: write

jobs:
  # Idempotently ensures the GitHub Release exists so the matrix upload
  # step below has somewhere to attach assets. Safe to re-run — creating
  # an existing release is a no-op via `|| true`.
  create-release:
    name: create release if missing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: ensure release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -eux
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --title "$TAG" \
              --generate-notes
          fi

  build:
    name: build ${{ matrix.name }}
    needs: create-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # `features` is the literal cargo flag string (empty = stock build).
        # `cross` selects the docker-based cross toolchain; `upx` gates
        # packing. Every Linux target ships twice: a stock ~4 MB binary and
        # a `-wasm` one (~7.2 MiB, see docs/v0.12-events.md) with the plugin
        # runtime compiled in. macOS/Windows stay stock-only — plugin users
        # are overwhelmingly on Linux, and doubling those jobs buys little.
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ''
            features: ''
            cross: false
            upx: true
          - name: linux-x86_64-wasm
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ''
            features: '--features wasm'
            cross: false
            upx: true
          # Fully static build for old glibc systems (CentOS 7 etc.).
          # rustls-tls means no OpenSSL C dep — musl links clean.
          - name: linux-x86_64-musl
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            ext: ''
            features: ''
            cross: false
            upx: true
          - name: linux-x86_64-musl-wasm
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            ext: ''
            features: '--features wasm'
            cross: false
            upx: true
          # arm64 static: covers Raspberry Pi / arm64 servers and runs under
          # Termux on Android (bundled webpki CA roots and PATH-resolved
          # `bash` mean no bionic-specific build is needed). `ring` pulls a
          # C/asm dep, so this needs a real cross toolchain — hence `cross`.
          - name: linux-aarch64-musl
            runner: ubuntu-latest
            target: aarch64-unknown-linux-musl
            ext: ''
            features: ''
            cross: true
            # UPX 4.x packs linux/arm64 as well as x86: measured 3730232 ->
            # 1527248 (40.9%) on the v0.12.0-preview artifact. The `|| true`
            # in the staging step still covers a stub that refuses to run.
            upx: true
          - name: linux-aarch64-musl-wasm
            runner: ubuntu-latest
            target: aarch64-unknown-linux-musl
            ext: ''
            features: '--features wasm'
            cross: true
            upx: true
          - name: macos-aarch64
            runner: macos-latest
            target: aarch64-apple-darwin
            ext: ''
            features: ''
            cross: false
            upx: true
          # macos-x86_64 (Intel) dropped: GitHub's `macos-13` runner supply
          # is scarce (jobs sit in queue for 10+ min) and Apple Silicon covers
          # M1+ users. Intel users can `cargo build --target x86_64-apple-darwin`.
          - name: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            ext: '.exe'
            features: ''
            cross: false
            upx: true

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          # workflow_dispatch: pull the given tag; push event: default HEAD.
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: validate VERSION against tag
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -eux
          TAG="${{ github.ref_name }}"
          FILE_V="$(cat VERSION 2>/dev/null || grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)"
          EXPECTED="v${FILE_V}"
          if [ "$TAG" != "$EXPECTED" ]; then
            echo "::error::git tag ($TAG) does not match VERSION file (v$FILE_V)."
            exit 1
          fi

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Native musl only. The aarch64 musl build gets its sysroot from the
      # `cross` docker image instead, and musl-tools would be the wrong arch.
      - name: install musl toolchain
        if: contains(matrix.target, 'musl') && !matrix.cross
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: install cross
        if: matrix.cross
        run: cargo install cross --locked --version 0.2.5

      # Keyed on matrix.name, not matrix.target: stock and -wasm builds share
      # a target triple but produce different artifacts, and a shared key
      # would let one clobber the other's cache.
      - name: cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: build release
        run: ${{ matrix.cross && 'cross' || 'cargo' }} build --release --target ${{ matrix.target }} ${{ matrix.features }}

      - name: install upx (ubuntu)
        if: matrix.upx && startsWith(matrix.runner, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y upx-ucl

      - name: install upx (macos)
        if: matrix.upx && startsWith(matrix.runner, 'macos')
        run: brew install upx

      - name: install upx (windows)
        if: matrix.upx && startsWith(matrix.runner, 'windows')
        shell: pwsh
        run: choco install upx --no-progress -y

      - name: stage asset
        shell: bash
        run: |
          set -eux
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          SRC="target/${{ matrix.target }}/release/nanopi${{ matrix.ext }}"
          OUT="nanopi-${TAG}-${{ matrix.name }}${{ matrix.ext }}"
          mkdir -p dist
          cp "$SRC" "dist/$OUT"
          # [profile.release] already sets strip = true, so this is belt and
          # braces on Unix. Skipped for cross builds: the host `strip` is
          # x86-only and would just error on an aarch64 binary. Windows keeps
          # symbols so debuggers can find them.
          if [ "${{ matrix.ext }}" != ".exe" ] && [ "${{ matrix.cross }}" != "true" ]; then
            strip "dist/$OUT" || true
          fi
          # UPX-pack where enabled: --best --lzma gives ~60% shrink at
          # a ~100 ms startup cost, which is unnoticeable for TUI use.
          # `|| true` so a platform that trips UPX (rare, but possible
          # on some macOS builds) doesn't fail the whole release —
          # the unpacked binary is still uploaded.
          if [ "${{ matrix.upx }}" = "true" ]; then
            upx --best --lzma "dist/$OUT" || true
          fi
          ls -lh "dist/$OUT"

      - name: upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -eux
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          # --clobber overwrites if the asset already exists (rerun-safe).
          gh release upload "$TAG" dist/* \
            --repo "${{ github.repository }}" \
            --clobber
