name: release

# Fires when a version tag is pushed (v0.8.0, v0.8.1, v1.0.0, …).
# Also exposes a manual "Run workflow" button on the Actions tab
# with a tag input, so back-filling assets on an existing release
# (e.g. v0.8.0 which was tagged before this workflow existed) is
# one click away.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build + upload assets for (e.g. v0.8.0)'
        required: true
        type: string

# GitHub tightened default GITHUB_TOKEN scopes to read-only for new repos;
# creating releases and uploading assets both need `contents: write`.
permissions:
  contents: write

jobs:
  # Idempotently ensures the GitHub Release exists so the matrix upload
  # step below has somewhere to attach assets. Safe to re-run — creating
  # an existing release is a no-op via `|| true`.
  create-release:
    name: create release if missing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: ensure release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -eux
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --title "$TAG" \
              --generate-notes
          fi

  build:
    name: build ${{ matrix.name }}
    needs: create-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ''
          # Fully static build for old glibc systems (CentOS 7 etc.).
          # rustls-tls means no OpenSSL C dep — musl links clean.
          - name: linux-x86_64-musl
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            ext: ''
          - name: macos-aarch64
            runner: macos-latest
            target: aarch64-apple-darwin
            ext: ''
          # macos-x86_64 (Intel) dropped: GitHub's `macos-13` runner supply
          # is scarce (jobs sit in queue for 10+ min) and Apple Silicon covers
          # M1+ users. Intel users can `cargo build --target x86_64-apple-darwin`.
          - name: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            ext: '.exe'

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          # workflow_dispatch: pull the given tag; push event: default HEAD.
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: install musl toolchain
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: install upx (ubuntu)
        if: startsWith(matrix.runner, 'ubuntu')
        run: sudo apt-get install -y upx-ucl

      - name: install upx (macos)
        if: startsWith(matrix.runner, 'macos')
        run: brew install upx

      - name: install upx (windows)
        if: startsWith(matrix.runner, 'windows')
        shell: pwsh
        run: choco install upx --no-progress -y

      - name: stage asset
        shell: bash
        run: |
          set -eux
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          SRC="target/${{ matrix.target }}/release/nanopi${{ matrix.ext }}"
          OUT="nanopi-${TAG}-${{ matrix.name }}${{ matrix.ext }}"
          mkdir -p dist
          cp "$SRC" "dist/$OUT"
          # Strip on Unix targets first (UPX packs better against
          # stripped binaries). Windows keeps symbols so debuggers can
          # find them.
          if [ "${{ matrix.name }}" != "windows-x86_64" ]; then
            strip "dist/$OUT" || true
          fi
          # UPX-pack every platform: --best --lzma gives ~60% shrink at
          # a ~100 ms startup cost, which is unnoticeable for TUI use.
          # `|| true` so a platform that trips UPX (rare, but possible
          # on some macOS builds) doesn't fail the whole release —
          # the unpacked binary is still uploaded.
          upx --best --lzma "dist/$OUT" || true
          ls -lh "dist/$OUT"

      - name: upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -eux
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          # --clobber overwrites if the asset already exists (rerun-safe).
          gh release upload "$TAG" dist/* \
            --repo "${{ github.repository }}" \
            --clobber
